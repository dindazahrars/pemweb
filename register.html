<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="porto.html" method="get" enctype="multipart/form-data" class="register-form">
            <h2>REGISTER</h2>
            <p>Silakan masukkan data Anda</p>
            <div class="input-group">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" placeholder="Masukkan nama" required>
            </div>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email" required>
            </div>
            <div class="input-group">
                <label for="NIM">NIM:</label>
                <input type="number" id="NIM" name="NIM" placeholder="Masukkan NIM" required>
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            <div class="input-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>
            </div>
            <button type="submit">REGISTER</button>
            <p class="login">Sudah Punya Akun? <a href="login.html">Login di sini</a></p>
        </form>
    </div>
</body>
</html>
