<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Register</title>
</head>
<body bgcolor="#e3f2fd" style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <form action="porto.html" method="get" style="width: 500px;">
        <table bgcolor="white" border="0" cellpadding="10" cellspacing="0"
            style="width: 100%; height: auto; border-radius: 10px; box-shadow: 2px 2px 10px rgba(0,0,0,0.2);">
            <tr>
                <td colspan="2" align="center" style="font-size: 24px; font-family: Arial, sans-serif; font-weight: bold; color: #333; padding-top: 20px;">
                    REGISTER
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center" style="font-size: 14px; font-family: Arial, sans-serif; color: #666; padding-bottom: 15px;">
                    Silakan masukkan data Anda
                </td>
            </tr>
            <tr>
                <td style="width: 100px; padding-left: 25px;"><b>Nama:</b></td>
                <td style="padding-right: 25px;"><input type="text" name="name" placeholder="Masukkan nama" required
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td style="width: 100px; padding-left: 25px;"><b>Email:</b></td>
                <td style="padding-right: 25px;"><input type="email" name="email" placeholder="Masukkan email" required
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td style="width: 100px; padding-left: 25px;"><b>NIM:</b></td>
                <td style="padding-right: 25px;"><input type="number" name="NIM" placeholder="Masukkan NIM" required
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td style="padding-left: 25px;"><b>Password:</b></td>
                <td style="padding-right: 25px;"><input type="password" name="password" placeholder="Masukkan password" required
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td colspan="2" align="center" style="padding-top: 20px; padding-bottom: 10px;">
                    <div style="text-align: center; width: 100%;">
                        <input type="submit" value="REGISTER"
                            style="width: 240px; height: 40px; font-weight: bold; background: #0288d1; color: white; border: none; cursor: pointer; border-radius: 5px; margin: 0 auto;">
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center" style="font-size: 14px; color: #666; padding-bottom: 20px;">
                    Sudah Punya Akun? <a href="login.html" style="color: #0288d1; text-decoration: none; font-weight: bold;">Login di sini</a>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
