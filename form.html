<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
</head>
<body bgcolor="#f4f4f4" style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding-top: 70px;">
    <form action="#" method="post">
        <table bgcolor="white" border="0" cellpadding="15" cellspacing="0" style="width: 600px; height: 420px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);">
            <tr>
                <td colspan="2" align="center" style="font-size: 20px; font-family: Arial, sans-serif; font-weight: bold;">
                    FORM PERTEMUAN 3
                </td>
            </tr>
            <tr>
                <td style="width: 100px;">Email:</td>
                <td><input type="email" name="email" style="width: 100%; padding: 8px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" style="width: 100%; padding: 8px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin:</td>
                <td>
                    <input type="radio" id="jenis_kelamin" name="jenis_kelamin" value="laki_laki">
                    <label for="laki_laki">Laki - laki</label><br>
                    <input type="radio" id="jenis_kelamin" name="jenis_kelamin" value="perempuan">
                    <label for="perempuan">Perempuan</label><br>
                </td>
            </tr>
            <tr>
                <td style="width: 100px;">Alamat</td>
                <td><textarea name="alamat" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea></td>
            </tr>
            <tr>
                <td style="width: 100px;">Jurusan</td >
                <td>
                    <select name="Jurusan" id="prodi" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        <option value="rpl">------</option>
                        <option value="rpl">RPL</option>
                        <option value="PGPAUD">PGPAUD</option>
                        <option value="PGSD">PGSD</option>
                        <option value="tekkom">TEKKOM</option>
                        <option value="Multimedia">Multimedia</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="width: 100px;">File</td>
                <td><input type="file" name="file" ></td>
            </tr>
            <tr>
                <td style="width: 100px;">Halaman website</td>
                <td><input type="url" name="url" style="width: 100%; padding: 8px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td style="width: 100px;">Penilaian</td>
                <td><input type="range" name="range" style="width: 100%; padding: 8px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td style="width: 100px;">Warna</td>
                <td><input type="color" id="colorpicker" value="#0000ff"></td>
            </tr>
            <tr>
                <td style="width: 100px;">Tanggal Lahir</td>
                <td><input type="date" name="ttl" style="width: 100%; padding: 8px; box-sizing: border-box;"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="SUBMIT" style="width: 100%; height: 40px; font-weight: bold; border: none; background: #333; color: white; cursor: pointer; border-radius: 5px;">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
